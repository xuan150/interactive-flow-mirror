<title>無名之物</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: a black 2:1 stage (the 4m x 2m wall) centred in the window; a quiet control strip floats over its lower edge. Single dark world by choice. */
:root {
  color-scheme: dark;
  --void: #000;
  --ink: #dbe3ea;
  --ink-dim: #7f8b97;
  --hair: rgba(219, 227, 234, .16);
  --glass: rgba(5, 7, 10, .66);
  --live: #bfe4ff;
  --ui: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
html, body { height: 100%; background: var(--void); color: var(--ink); font-family: var(--ui); overflow: hidden; }
#stage { position: fixed; inset: 0; display: grid; place-items: center; }
canvas { display: block; background: var(--void); touch-action: none; }
#bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 16px;
  padding: 7px 12px; font-size: 13px;
  background: var(--glass); border: 1px solid var(--hair); border-radius: 10px;
  opacity: .45; transition: opacity .3s;
}
#bar:hover, #bar:focus-within { opacity: 1; }
.worlds { display: flex; gap: 4px; }
.worlds button {
  font: inherit; color: var(--ink-dim); background: transparent;
  border: 1px solid transparent; border-radius: 6px; padding: 4px 10px; cursor: pointer;
}
.worlds button:hover { color: var(--ink); }
.worlds button[aria-pressed="true"] { color: var(--ink); border-color: var(--hair); }
label { display: flex; align-items: center; gap: 6px; color: var(--ink-dim); cursor: pointer; }
label:hover { color: var(--ink); }
input { accent-color: var(--live); margin: 0; }
button:focus-visible, input:focus-visible { outline: 1px solid var(--live); outline-offset: 2px; }
#status {
  position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  font: 12px/1.7 var(--mono); color: var(--ink-dim); white-space: pre; pointer-events: none;
  font-variant-numeric: tabular-nums;
}
#err {
  position: fixed; inset: 16px; overflow: auto; margin: 0; padding: 16px;
  font: 12px/1.5 var(--mono); color: #ffb9ad; white-space: pre-wrap;
  background: rgba(0, 0, 0, .88); border: 1px solid #5c2b25; border-radius: 8px;
}
</style>

<div id="stage"><canvas id="gl"></canvas></div>
<div id="status" hidden></div>
<nav id="bar" aria-label="小樣控制">
  <div class="worlds">
    <button id="w-mixed" type="button" data-world="mixed">合體</button>
    <button id="w-creature" type="button" data-world="creature">1 無名生物</button>
    <button id="w-shell" type="button" data-world="shell">4 有機殼</button>
    <button id="w-attractor" type="button" data-world="attractor">2 奇異吸子</button>
  </div>
  <label for="presence"><input id="presence" type="checkbox">滑鼠＝有人</label>
  <label for="showStatus"><input id="showStatus" type="checkbox">顯示事件</label>
</nav>
<pre id="err" hidden></pre>

<script>
'use strict';
(() => {
const errBox = document.getElementById('err');
const showError = msg => { errBox.textContent = msg; errBox.hidden = false; };
window.addEventListener('error', e => showError(String((e.error && e.error.stack) || e.message)));

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) {
  showError('這個小樣需要支援 WebGL2 與浮點渲染的瀏覽器，請用桌機版 Chrome、Edge 或 Firefox 開啟。');
  return;
}

// ---------------------------------------------------------------- math
const TAU = Math.PI * 2;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const randn = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * Math.random()); };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const randDir = () => { const z = rand(-1, 1), t = rand(0, TAU), r = Math.sqrt(1 - z * z); return [r * Math.cos(t), z, r * Math.sin(t)]; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = randi(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// mat3 column-major
function axisAngle([x, y, z], ang) {
  const c = Math.cos(ang), s = Math.sin(ang), t = 1 - c;
  return [t*x*x + c, t*x*y + s*z, t*x*z - s*y, t*x*y - s*z, t*y*y + c, t*y*z + s*x, t*x*z + s*y, t*y*z - s*x, t*z*z + c];
}
function mat3mul(a, b) {
  const o = new Array(9);
  for (let c = 0; c < 3; c++) for (let r = 0; r < 3; r++) o[c*3 + r] = a[r] * b[c*3] + a[3 + r] * b[c*3 + 1] + a[6 + r] * b[c*3 + 2];
  return o;
}
function orthonormal(m) {
  const c0 = norm(m.slice(0, 3)), c1r = m.slice(3, 6);
  const c1 = norm(sub(c1r, mul(c0, dot(c0, c1r)))), c2 = cross(c0, c1);
  return [...c0, ...c1, ...c2];
}
// mat4 column-major
function perspective(fovy, aspect, n, f) {
  const t = 1 / Math.tan(fovy / 2), nf = 1 / (n - f);
  return [t / aspect, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) * nf, -1, 0, 0, 2 * f * n * nf, 0];
}
function lookAt(e, c, up) {
  const z = norm(sub(e, c)), x = norm(cross(up, z)), y = cross(z, x);
  return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1];
}
function mat4mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k*4 + r] * b[c*4 + k]; o[c*4 + r] = s; }
  return o;
}
function hsv(h, s, v) {
  h = (((h % 360) + 360) % 360) / 60;
  const c = v * s, x = c * (1 - Math.abs(h % 2 - 1)), m = v - c;
  const [r, g, b] = h < 1 ? [c, x, 0] : h < 2 ? [x, c, 0] : h < 3 ? [0, c, x] : h < 4 ? [0, x, c] : h < 5 ? [x, 0, c] : [c, 0, x];
  return [r + m, g + m, b + m].map(u => Math.pow(u, 2.2));
}

// ---------------------------------------------------------------- GLSL
const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
`;
const COMMON = `
uint hash_u(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float hash1(uint x){ return float(hash_u(x)) / 4294967295.0; }
vec3 hash3(uint x){ return vec3(hash1(x), hash1(x ^ 0x9E3779B9u), hash1(x ^ 0x85EBCA6Bu)); }
vec4 permute(vec4 x){ return mod(((x*34.0)+1.0)*x, 289.0); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314*r; }
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod(i, 289.0);
  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 1.0/7.0;
  vec3 ns = n_*D.wyz - D.xzx;
  vec4 j = p - 49.0*floor(p*ns.z*ns.z);
  vec4 x_ = floor(j*ns.z);
  vec4 y_ = floor(j - 7.0*x_);
  vec4 x = x_*ns.x + ns.yyyy;
  vec4 y = y_*ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x), p1 = vec3(a0.zw, h.y), p2 = vec3(a1.xy, h.z), p3 = vec3(a1.zw, h.w);
  vec4 nm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= nm.x; p1 *= nm.y; p2 *= nm.z; p3 *= nm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m*m;
  return 42.0*dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
vec3 nvec(vec3 p){ return vec3(snoise(p), snoise(p + vec3(19.1, 7.3, -11.7)), snoise(p + vec3(-5.9, 23.3, 13.1))); }
vec3 curl(vec3 p){
  const float e = .1;
  vec3 x0 = nvec(p - vec3(e,0,0)), x1 = nvec(p + vec3(e,0,0));
  vec3 y0 = nvec(p - vec3(0,e,0)), y1 = nvec(p + vec3(0,e,0));
  vec3 z0 = nvec(p - vec3(0,0,e)), z1 = nvec(p + vec3(0,0,e));
  return vec3((y1.z - y0.z) - (z1.y - z0.y), (z1.x - z0.x) - (x1.z - x0.z), (x1.y - x0.y) - (y1.x - y0.x)) / (2.*e);
}
// Smoke: a two-octave domain warp; continuous, so a surface tears into sheets and filaments instead of dust.
vec3 smokeWarp(vec3 p, float t, float amt, float spread){
  if(amt < .002) return p;
  vec3 q = p*(1.1 - .45*spread) + vec3(0., t*.13, t*.05);
  vec3 w = nvec(q);
  vec3 w2 = nvec(q*2.3 + w*1.4*amt + vec3(t*.21));
  return p + (w*(.95 + spread) + w2*.42)*amt;
}
float segD2(vec3 p, vec3 a, vec3 b){
  vec3 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0., 1.);
  vec3 d = pa - ba*h; return dot(d, d);
}
`;

const VS_FULL = HEAD + `
out vec2 vUv;
void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); vUv = p; gl_Position = vec4(p*2. - 1., 0., 1.); }`;

const FS_POINT = HEAD + `
in vec3 vCol; out vec4 o;
void main(){ vec2 d = gl_PointCoord*2. - 1.; float r2 = dot(d, d); if(r2 > 1.) discard; o = vec4(vCol*exp(-r2*2.5), 1.); }`;

const FS_FADE = HEAD + `out vec4 o; void main(){ o = vec4(0.); }`;
const FS_COPY = HEAD + `uniform sampler2D uSrc; in vec2 vUv; out vec4 o; void main(){ o = texture(uSrc, vUv); }`;

const FS_DOWN = HEAD + `
uniform sampler2D uSrc; uniform vec2 uTexel; uniform float uPrefilter, uThreshold;
in vec2 vUv; out vec4 o;
vec3 S(vec2 off){ return texture(uSrc, vUv + off*uTexel).rgb; }
void main(){
  vec3 c = S(vec2(0))*.125
    + (S(vec2(-2,2)) + S(vec2(2,2)) + S(vec2(-2,-2)) + S(vec2(2,-2)))*.03125
    + (S(vec2(0,2)) + S(vec2(-2,0)) + S(vec2(2,0)) + S(vec2(0,-2)))*.0625
    + (S(vec2(-1,1)) + S(vec2(1,1)) + S(vec2(-1,-1)) + S(vec2(1,-1)))*.125;
  if(uPrefilter > .5){
    float br = max(c.r, max(c.g, c.b)), knee = uThreshold*.5;
    float soft = clamp(br - uThreshold + knee, 0., 2.*knee); soft = soft*soft/(4.*knee + 1e-5);
    c *= max(soft, br - uThreshold) / max(br, 1e-5);
  }
  o = vec4(c, 1.);
}`;

const FS_UP = HEAD + `
uniform sampler2D uSrc; uniform vec2 uTexel;
in vec2 vUv; out vec4 o;
void main(){
  vec2 t = uTexel;
  vec3 c = texture(uSrc, vUv + vec2(-t.x, t.y)).rgb + texture(uSrc, vUv + vec2(0, t.y)).rgb*2. + texture(uSrc, vUv + t).rgb
    + texture(uSrc, vUv + vec2(-t.x, 0)).rgb*2. + texture(uSrc, vUv).rgb*4. + texture(uSrc, vUv + vec2(t.x, 0)).rgb*2.
    + texture(uSrc, vUv - t).rgb + texture(uSrc, vUv + vec2(0, -t.y)).rgb*2. + texture(uSrc, vUv + vec2(t.x, -t.y)).rgb;
  o = vec4(c/16., 1.);
}`;

const FS_COMP = HEAD + COMMON + `
uniform sampler2D uScene, uBloom; uniform float uBloomK, uExposure;
in vec2 vUv; out vec4 o;
vec3 aces(vec3 x){ return clamp((x*(2.51*x + .03))/(x*(2.43*x + .59) + .14), 0., 1.); }
void main(){
  vec3 c = texture(uScene, vUv).rgb + texture(uBloom, vUv).rgb*uBloomK;
  vec2 q = (vUv - .5)*vec2(2., 1.);
  c *= 1. - .32*dot(q, q);
  c = pow(aces(c*uExposure), vec3(1./2.2));
  c += (hash1(uint(gl_FragCoord.x)*1973u + uint(gl_FragCoord.y)*9277u) - .5)/255.;
  o = vec4(c, 1.);
}`;

// Background dust: stateless motes across a deep box, out-of-focus ones grow and dim.
const VS_DUST = HEAD + COMMON + `
uniform mat4 uVP; uniform float uPx, uTime, uDustB, uFocusD; uniform vec3 uPalA0;
out vec3 vCol;
void main(){
  uint id = uint(gl_VertexID);
  vec3 h = hash3(id*11u + 17u);
  vec3 p = vec3(h.x*16. - 8., h.y*8. - 4., -h.z*12. + 2.);
  float t = uTime;
  p += vec3(sin(t*.07 + h.y*20.), sin(t*.05 + h.z*17.)*.6, cos(t*.06 + h.x*13.))*.4;
  p.y = mod(p.y + t*.03 + 4., 8.) - 4.;
  vec4 cp = uVP*vec4(p, 1.);
  gl_Position = cp;
  float base = .011*uPx/cp.w;
  float sz = base + abs(cp.w - uFocusD)*.012*uPx/cp.w;
  float tw = .5 + .5*sin(t*(.6 + h.x*1.7) + h.z*30.);
  float b = uDustB*(.35 + .6*pow(hash1(id*5u + 3u), 12.))*(.4 + .6*tw);
  float ps = clamp(sz, 1., 40.);
  gl_PointSize = ps;
  vCol = mix(vec3(.75, .8, .85), uPalA0, .15)*b*clamp(base*base/(ps*ps), .03, 1.);
}`;

// ---- 無名生物 and 有機殼: one set of stateful particles with inertia, pulled each frame onto a target surface: the
// creature's metaball field, the shell's deformed sphere, or a blend of the two while one kind turns into the other.
const FS_LIFE_SIM = HEAD + COMMON + `
uniform sampler2D uPos, uVel;
uniform float uDt, uTime, uInit;
uniform vec4 uBA[8], uBB[8], uTA0[4], uTA1[4], uTB0[4], uTB1[4];
uniform vec4 uLA[5], uLB[5], uFA[2], uFB[2], uSA[3], uSB[3];
uniform vec3 uCenter; uniform mat3 uRot; uniform float uScale;
uniform float uM, uChaos, uTension, uCollapse, uBurst, uSweep, uSpread, uDwell, uPeel, uShellA, uShellB;
uniform vec3 uSweepAxis, uPresO, uPresD, uPeelAxis;
uniform vec4 uPres;
layout(location = 0) out vec4 oPos;
layout(location = 1) out vec4 oVel;

vec4 gB[8]; vec4 gT0[4]; vec4 gT1[4];
vec3 gPO, gPD; float gDent;

float fieldLog(vec3 q){
  float f = 0.;
  for(int i = 0; i < 8; i++){ float r = gB[i].w; if(r <= 0.) continue; vec3 d = q - gB[i].xyz; f += r*r/(dot(d, d) + 1e-4); }
  for(int i = 0; i < 4; i++){ float r = gT0[i].w; if(r <= 0.) continue; float k = r*r/(segD2(q, gT0[i].xyz, gT1[i].xyz) + 1e-4); f += k*k; }
  // someone in front parts the body: the field thins around their line of sight, so the surface opens around them
  if(gDent > 0.){ vec3 e = q - gPO; e -= gPD*dot(e, gPD); f *= 1. - gDent*exp(-dot(e, e)/.16); }
  // wobble only near the surface; far out it would carve false bumps that trap particles in clumps
  float lf = log(max(f, 1e-4));
  return lf + .3*snoise(q*1.4 + vec3(0., uTime*.16, uTime*.1))*smoothstep(-3., -.5, lf);
}

// Shell radius along direction d. Lobes swing and swell slowly, so a held shell keeps breathing; glow is how much the
// spot lights up (fold crests, lobe tips).
float shellR(vec3 d, vec4 L[5], vec4 Fo[2], vec4 S[3], out float glow){
  float r = 1., ridge = 0., tip = 0.;
  for(int i = 0; i < 5; i++){
    float k = length(L[i].xyz); if(k < 1e-3) continue;
    float fi = float(i);
    vec3 ax = normalize(L[i].xyz/k + .3*vec3(sin(uTime*.11 + fi*1.7), sin(uTime*.13 + fi*2.9), cos(uTime*.09 + fi*.7)));
    float l = pow(max(dot(d, ax), 0.), k);
    r += L[i].w*(1. + .35*sin(uTime*(.19 + .04*fi) + fi*2.3))*l; tip = max(tip, l*step(0., L[i].w));
  }
  for(int i = 0; i < 2; i++){
    if(Fo[i].w <= 0.) continue;
    float s = sin(dot(d, Fo[i].xyz)*3.14159 + uTime*.35 + float(i)*1.7);
    r += Fo[i].w*s; ridge = max(ridge, pow(s*.5 + .5, 10.));
  }
  r += S[2].y*snoise(d*S[2].z + vec3(uTime*.06, uTime*.045, -uTime*.05));
  r *= mix(1., S[2].x, smoothstep(S[1].w, S[1].w + .3, dot(d, S[1].xyz)));
  glow = ridge*2.2 + tip*1.6;
  return r;
}
vec3 twist(vec3 p, float a){ float c = cos(a*p.y), s = sin(a*p.y); p.xz = mat2(c, -s, s, c)*p.xz; return p; }
// A particle's home on the shell, from its own direction d. Ridge particles slide onto the nearest crest of a fold, so
// crests read as glowing lines drifting over the surface. lay: (thickness layer, radius factor).
vec3 shellTarget(vec3 d, vec4 L[5], vec4 Fo[2], vec4 S[3], int snap, vec2 lay, out float glow){
  float tw = S[0].w + .4*sin(uTime*.15 + 1.1);
  if(snap >= 0){
    int fi = (snap == 1 && Fo[1].w > 0.) ? 1 : 0;
    float qn = length(Fo[fi].xyz);
    if(qn > 1e-3){
      vec3 a = Fo[fi].xyz/qn;
      float ph = uTime*.35 + float(fi)*1.7;
      float k = floor((dot(d, a)*qn*3.14159 + ph - 1.5708)/6.28318 + .5);
      float c = (1.5708 + k*6.28318 - ph)/(qn*3.14159);
      vec3 t = d - a*dot(d, a);
      float tl = length(t);
      if(abs(c) < .98 && tl > 1e-4) d = a*c + t/tl*sqrt(1. - c*c);
    }
  }
  float r = shellR(d, L, Fo, S, glow)*(1. + lay.x*S[2].w)*lay.y;
  return twist(d*r, tw)*S[0].xyz;
}

void main(){
  ivec2 ij = ivec2(gl_FragCoord.xy);
  uint id = uint(ij.y*textureSize(uPos, 0).x + ij.x);
  if(uInit > .5){
    vec3 h = hash3(id*3u + 1u);
    float z = h.x*2. - 1., a = h.y*6.2831853, r = sqrt(1. - z*z);
    oPos = vec4(uCenter + vec3(r*cos(a), z, r*sin(a))*pow(h.z, .33)*2.2, hash1(id*7u + 11u));

const ODE = `
vec3 F(int f, vec3 p, vec4 a, vec4 b){
  float x = p.x, y = p.y, z = p.z;
  if(f == 0) return vec3((z - a.y)*x - a.w*y, a.w*x + (z - a.y)*y, a.z + a.x*z - z*z*z/3. - (x*x + y*y)*(1. + b.x*z) + b.y*z*x*x*x);

  if(f == 2) return vec3(-a.x*x - 4.*y - 4.*z - y*y, -a.x*y - 4.*z - 4.*x - z*z, -a.x*z - 4.*x - 4.*y - x*x);

  if(f == 4) return vec3(a.x*x - y*z, a.y*y + x*z, a.z*z + x*y/3.);

  return vec3(a.x*x + y*z, a.y*x + a.z*y - x*z, -z - x*y);

  }
  if (filled / (G * G * G) < .035) return null; // too thin: reads as a drawn loop
  let sum = 0, cnt = 0;
  for (let i = 0; i < N; i += 64, cnt++) sum += len(famF(fi, params, out[i * 4], out[i * 4 + 1], out[i * 4 + 2]));
  return { samples: out, center: [cx, cy, cz], k: 1 / ext, rate: .5 / (sum / cnt / ext) };
}

// ---------------------------------------------------------------- worlds
let cam = null;
function uCommon(c) {
  const s = c.sig, nx = c.palNext || c.pal;
  return {
    uTime: c.time, uDt: c.dt, uM: s.m, uChaos: s.chaos, uTension: s.tension, uCollapse: s.collapse, uBurst: s.burst,
    uFlash: s.flash, uDim: s.dim, uSpread: s.spread, uSweep: s.sweep, uSweepAxis: c.sweepAxis,
    uPulse: [...c.pulse.axis, c.pulse.pos], uPulseAmp: c.pulse.amp,
    uCenter: c.centerNow, uRot: c.R, uScale: c.scaleNow,
    uPalA0: c.pal.body, uPalA1: c.pal.hi, uPalB0: nx.body, uPalB1: nx.hi,
    uPres: [...presence.world, presence.strength], uPresO: presence.origin, uPresD: presence.dir,
    uDwell: .15 + presence.dwell / 10, // a few follow at once, the whole loose band after ~10 s
    uPeel: s.peel, uPeelAxis: c.peelAxis, uVP: cam.vp, uPx: cam.px,
  };
}

const worlds = {
  // 無名生物 and 有機殼 are one world: the same particles take either kind's shape; types says which kinds may appear
  life: {
    label: '合體', types: ['creature', 'shell'], trails: false, roam: [1.1, .22],
    camera: t => ({ eye: [Math.sin(t * .05) * .5, -.35 + Math.sin(t * .037) * .12, 5.2], target: [0, .05, 0], fov: 32 }),
    makeForm(prev, style) {
      // a transition sometimes turns one kind into the other, the big ones (散逸, 塌縮) more often
      let type = prev ? prev.type : pick(this.types);
      if (prev && this.types.length > 1 && Math.random() < (style === 'rest' || style === 'implode' ? .6 : .25)) type = this.types.find(t => t !== type);
      return type === 'shell' ? makeShell() : makeCreature(prev && prev.type === 'creature' ? prev : null);
    },
    u(c) {
      // a kind missing on one side keeps the other side's shape, so its half of the blend holds still
      const A = c.form, B = c.next || A, cr = f => f.type === 'creature', cA = cr(A) ? A : B, cB = cr(B) ? B : A, sA = cr(A) ? B : A, sB = cr(B) ? A : B;
      return {
        uBA: cA.blobs, uBB: cB.blobs, uTA0: cA.t0, uTA1: cA.t1, uTB0: cB.t0, uTB1: cB.t1,
        uLA: sA.L, uLB: sB.L, uFA: sA.Fo, uFB: sB.Fo, uSA: sA.S, uSB: sB.S, uShellA: +!cr(A), uShellB: +!cr(B),
        uBase: .088 * c.breath * lerp(A.gain, B.gain, c.sig.m),
      };
    },
    enter(c) { this.sim = this.sim || makeSim(512, 384); simPass(this.sim, P.lifeSim, { ...uCommon(c), ...this.u(c), uInit: 1 }); },
    simulate(c) { simPass(this.sim, P.lifeSim, { ...uCommon(c), ...this.u(c), uInit: 0 }); },
    draw(c) { drawPoints(P.life, this.sim.n, { ...uCommon(c), ...this.u(c) }, [this.sim.a.pos, this.sim.a.vel]); },
    describe: f => (f.type === 'creature' ? '生物 ' : '') + f.name,
  },
  attractor: {
    label: '奇異吸子', trails: true, roam: [.5, .1], gen: 0, recentFams: [],
    camera: t => { const a = t * .05; return { eye: [Math.sin(a) * 3.4, .3 * Math.sin(t * .05), Math.cos(a) * 3.4], target: [0, 0, 0], fov: 45 }; },
    makeForm(prev, style) {
      const same = prev && style === 'morph';
      for (let tries = 0; tries < 14; tries++) {
        let fi = same && tries < 6 ? prev.fam : randi(0, FAMS.length - 1);
        if (!(same && tries < 6)) while (prev && (fi === prev.fam || this.recentFams.includes(fi))) fi = randi(0, FAMS.length - 1);
        const Fm = FAMS[fi];
        const params = Fm.range ? Fm.range.map(([a, b]) => rand(a, b)) : Fm.base.map(v => v * (1 + randn() * Fm.jit));
        const r = sampleAttractor(fi, params);
        if (!r) continue;
        this.recentFams.push(fi); if (this.recentFams.length > 2) this.recentFams.shift();
        const packed = new Float32Array(8); packed.set(params);
        return { fam: fi, name: Fm.name, params: packed, ...r, scale: rand(.8, 1) };
      }
      return prev || this.makeForm(null, 'dissolve');
    },
    upload(tex, f) { gl.bindTexture(gl.TEXTURE_2D, tex); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, SAMP, SAMP, gl.RGBA, gl.FLOAT, f.samples); },
    enter(c) {
      this.sim = this.sim || makeSim(256, 256);
      this.sampA = this.sampA || makeTex(SAMP, SAMP, gl.RGBA32F, gl.RGBA, gl.FLOAT, gl.NEAREST);
      this.sampB = this.sampB || makeTex(SAMP, SAMP, gl.RGBA32F, gl.RGBA, gl.FLOAT, gl.NEAREST);
      this.gen = 0;
      this.upload(this.sampA, c.form); this.upload(this.sampB, c.form);
      simPass(this.sim, P.attSim, { ...uCommon(c), ...this.u(c), uInit: 1 }, [this.sampA, this.sampB]);
    },
    onTransition(c) { this.upload(this.sampB, c.next); },
    onCommit() { [this.sampA, this.sampB] = [this.sampB, this.sampA]; this.gen++; },
    u(c) {
      const A = c.form, B = c.next || A, dt = c.dt * (1 + .6 * c.sig.tension);
      const tauA = A.rate * dt, tauB = B.rate * dt;
      const steps = clamp(Math.max(Math.ceil(tauA / FAMS[A.fam].dt), Math.ceil(tauB / FAMS[B.fam].dt)), 1, 8);
      return {
        uFamA: A.fam, uFamB: B.fam, uSteps: steps,
        uPA0: A.params.subarray(0, 4), uPA1: A.params.subarray(4, 8), uPB0: B.params.subarray(0, 4), uPB1: B.params.subarray(4, 8),
        uNA: [...A.center, A.k], uNB: [...B.center, B.k], uDtA: Math.min(tauA / steps, FAMS[A.fam].dt * 1.5), uDtB: Math.min(tauB / steps, FAMS[B.fam].dt * 1.5),
        uGen: this.gen, uBase: .03 * c.breath,
      };
    },
    simulate(c) { simPass(this.sim, P.attSim, { ...uCommon(c), ...this.u(c), uInit: 0 }, [this.sampA, this.sampB]); },
    draw(c) { drawPoints(P.att, this.sim.n, { ...uCommon(c), ...this.u(c) }, [this.sim.a.pos, this.sim.a.vel]); },
    describe: f => f.name,
  },
};

// ---------------------------------------------------------------- UI + loop
const statusBox = document.getElementById('status');
const presenceBox = document.getElementById('presence');
const statusToggle = document.getElementById('showStatus');
const buttons = [...document.querySelectorAll('.worlds button')];
const opts = new Set(location.hash.slice(1).split('&').filter(Boolean));
const FORCED = [...opts].find(k => k in STYLES); // test hook: #rest etc. makes every transition that style
presenceBox.checked = opts.has('presence');
statusToggle.checked = opts.has('status');
statusBox.hidden = !statusToggle.checked;
presenceBox.addEventListener('change', () => { presence.on = presenceBox.checked; });
statusToggle.addEventListener('change', () => { statusBox.hidden = !statusToggle.checked; });
presence.on = presenceBox.checked;

// 1 and 4 are 合體 held to one kind
const MODES = { mixed: { label: '合體', types: ['creature', 'shell'] }, creature: { label: '無名生物', types: ['creature'] }, shell: { label: '有機殼', types: ['shell'] } };
let world, conductor;
function enterWorld(key) {
  world = key === 'attractor' ? worlds.attractor : Object.assign(worlds.life, MODES[key]);
  conductor = new Conductor(world);
  buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.world === key)));
  cam = cameraFor(world, 0);
  world.enter(conductor);
  bindTarget(scene); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
}
buttons.forEach(b => b.addEventListener('click', () => enterWorld(b.dataset.world)));

function cameraFor(w, t) {
  const c = w.camera(t), fov = c.fov * Math.PI / 180, aspect = canvas.width / canvas.height;
  const vp = mat4mul(perspective(fov, aspect, .05, 60), lookAt(c.eye, c.target, [0, 1, 0]));
  return { ...c, vp, px: canvas.height / (2 * Math.tan(fov / 2)), fovRad: fov, aspect };
}
function updatePresence(dt) {
  const target = presence.on && presence.inside ? 1 : 0;
  presence.strength = lerp(presence.strength, target, 1 - Math.exp(-dt * (target ? 1.8 : 1)));
  if (presence.strength > .5 && presence.was <= .5) conductor.stimulus();
  presence.was = presence.strength;
  presence.dwell = presence.strength > .5 ? presence.dwell + dt : Math.max(0, presence.dwell - dt * 2);
  // cast the pointer onto the plane through the form that faces the camera
  const f = norm(sub(cam.target, cam.eye)), r = norm(cross(f, [0, 1, 0])), u = cross(r, f), th = Math.tan(cam.fovRad / 2);
  const d = norm(add(f, add(mul(r, presence.ndc[0] * th * cam.aspect), mul(u, presence.ndc[1] * th))));
  presence.origin = cam.eye; presence.dir = d;
  const den = dot(d, f);
  if (den > 1e-3) presence.world = add(cam.eye, mul(d, dot(sub(conductor.centerNow, cam.eye), f) / den));
}

// multiply the bound target by k: 0 clears it, just under 1 leaves light trails
function fade(k) { gl.enable(gl.BLEND); gl.blendFunc(gl.ZERO, gl.CONSTANT_COLOR); gl.blendColor(k, k, k, 1); use(P.fade, {}); draw3(); }

let last = performance.now(), frame = 0;
function loop(now) {
  const dt = Math.min(1 / 30, Math.max(1e-3, (now - last) / 1000));
  last = now;
  resize();
  conductor.update(dt);
  cam = cameraFor(world, conductor.time);
  updatePresence(dt);
  world.simulate(conductor);
  const trail = .9 + .055 * conductor.sig.chaos;
  // Dust is always seen through 奇異吸子's orbiting camera: motes in front of and behind its pivot slide opposite ways,
  // which reads as deep space. Moving the whole sheet one way instead read as rain.
  const dc = cameraFor(worlds.attractor, conductor.time);
  const dustU = { uVP: dc.vp, uPx: dc.px, uTime: conductor.time, uDustB: .22, uFocusD: len(sub(dc.eye, dc.target)), uPalA0: conductor.pal.body };
  if (world.trails) {
    // 奇異吸子: the whole scene is a trail buffer, dust included
    bindTarget(scene); fade(trail);
    world.draw(conductor); drawPoints(P.dust, 2500, dustU);
  } else {
    // the body is drawn sharp every frame; the dust keeps its own short trail underneath, so it streaks the same way
    bindTarget(dustRt); fade(trail); drawPoints(P.dust, 2500, dustU);
    bindTarget(scene); fade(0);
    world.draw(conductor);
    use(P.copy, { uSrc: 0 }, [dustRt.tex]); draw3();
  }
  bloom();
  bindTarget(null);
  use(P.comp, { uScene: 0, uBloom: 1, uBloomK: .22, uExposure: 1 }, [scene.tex, mips[0].tex]);
  draw3();
  if (!statusBox.hidden && frame++ % 6 === 0) {
    const c = conductor;
    const when = c.phase === 'hold' ? `${c.t.toFixed(1)} / ${c.dur.toFixed(1)} s` : `${Math.round(c.t / c.dur * 100)}%`;
    statusBox.textContent = [
      world.label,
      `事件  ${c.label}  ${when}${c.flurry ? '  連變' : ''}`,
      `形態  ${world.describe(c.form)}${c.next ? '  →  ' + world.describe(c.next) : ''}`,
      `對人  ${presence.on ? (presence.strength > .5 ? `有人在場 ${presence.dwell.toFixed(0)} s` : '無人') : '（未開）'}`,
    ].join('\n');
  }
  requestAnimationFrame(loop);
}
enterWorld(['mixed', 'creature', 'shell', 'attractor'].find(k => opts.has(k)) || 'mixed');
requestAnimationFrame(loop);
})();
</script>
